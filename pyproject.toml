[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-tracker"
version = "0.1.0.dev0"
description = "Portable project-aware decision tracking with SQLite, browser, CLI and API interfaces."
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Polymath Global"}]
dependencies = ["fastapi==0.121.3", "uvicorn==0.38.0"]
classifiers = ["Development Status :: 1 - Planning", "Private :: Do Not Upload"]

[project.urls]
Repository = "https://github.com/joediggidyyy/decision-tracker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
